[tox]
isolated_build = true
envlist = py312-django52
requires =
    tox-poetry-dev-dependencies

[testenv]
poetry_add_dev_dependencies = True
deps =
    django52: Django>=5.2,<5.3
    django-environ
    psycopg2-binary
whitelist_externals =
    poetry
    bash
skip_install = true
commands =
    python -V
    python manage.py version
    pytest .

